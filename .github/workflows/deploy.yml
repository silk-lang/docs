name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A silk release can trigger a rebuild so the site picks it up:
  # POST /repos/silk-lang/docs/dispatches with {"event_type": "silk-release"}.
  repository_dispatch:
    types: [silk-release]
  # Every hour, a quick check deploys when there is a release the site has
  # not been built with yet (the `release` job below).
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The newest silk release, and whether a deploy already built the site with
  # it. Scheduled runs stop here when nothing is new.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
      deployed: ${{ steps.marker.outputs.cache-hit }}
    steps:
      - id: newest
        # Every silk release so far is a prerelease, which releases/latest
        # leaves out, so this takes the first of the list.
        run: echo "tag=$(gh api 'repos/silk-lang/silk/releases?per_page=1' --jq '.[0].tag_name')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: marker
        uses: actions/cache/restore@v4
        with:
          path: .deployed-release
          key: deployed-release-${{ steps.newest.outputs.tag }}
          lookup-only: true

  deploy:
    needs: release
    if: github.event_name != 'schedule' || needs.release.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Alchemy needs Node 24.11 or newer.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The archive from the last deploy, so only new releases are generated.
      - uses: actions/cache@v4
        with:
          path: |
            .versions
            .cache/silk.git
          key: docs-versions-${{ github.run_id }}
          restore-keys: docs-versions-
      # Every release's standard library reference into .versions/, and the
      # newest one into content/std, which the landing page lists.
      - run: node scripts/versions.ts --sync-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run deploy --no-input
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SILK_DOCS_DOMAIN: ${{ vars.SILK_DOCS_DOMAIN }}
          # Link previews (og:image, og:url) need the site's absolute origin:
          # the custom domain when one is set, otherwise the workers.dev URL.
          SILK_SITE_URL: ${{ vars.SILK_DOCS_DOMAIN != '' && format('https://{0}', vars.SILK_DOCS_DOMAIN) || 'https://silkdocs-website-prod-nneqbw44rs6hjtkw.juliaortiz-js.workers.dev' }}
          # Raises the GitHub API rate limit for the releases page.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo '${{ needs.release.outputs.tag }}' > .deployed-release
      - uses: actions/cache/save@v4
        with:
          path: .deployed-release
          key: deployed-release-${{ needs.release.outputs.tag }}
        # A second deploy with the same release finds the marker saved.
        continue-on-error: true
