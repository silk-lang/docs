name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A silk release can trigger a rebuild so the releases page picks it up:
  # POST /repos/silk-lang/docs/dispatches with {"event_type": "silk-release"}.
  repository_dispatch:
    types: [silk-release]
  # Daily rebuild as a fallback for new releases.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Alchemy needs Node 24.11 or newer.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy --no-input
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SILK_DOCS_DOMAIN: ${{ vars.SILK_DOCS_DOMAIN }}
          # Raises the GitHub API rate limit for the releases page.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
